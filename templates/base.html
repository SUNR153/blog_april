<!DOCTYPE html>
<html lang="ru">
<head>

    <title>{% block title %}Blog System{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <header>
        <h1>Blog System</h1>
        <nav>

        <p>© 2026 Blog System</p>

</html>
