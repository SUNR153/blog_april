{% extends 'blog/base.html' %}
{% block title %}Комментарий — Blog System{% endblock %}
{% block content %}
    <h2>Комментарий к посту «{{ post.title }}»</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% if comment %}Сохранить{% else %}Отправить{% endif %}</button>
    </form>
{% endblock %}
