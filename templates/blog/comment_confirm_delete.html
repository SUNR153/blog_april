{% extends 'base.html' %}

{% block title %}Удаление комментария — Blog System{% endblock %}

{% block content %}
    <h2>Удалить комментарий?</h2>
    <p>Вы уверены, что хотите удалить комментарий: «{{ comment.text|slice:":100" }}»?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'post_detail' post_id=comment.post.id %}">Отмена</a>
    </form>
{% endblock %}
