{% extends 'blog/base.html' %}
{% block title %}Удаление категории — Blog System{% endblock %}
{% block content %}
    <h2>Удалить категорию?</h2>
    <p>Вы уверены, что хотите удалить категорию «{{ category.name }}»?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'category_list' %}">Отмена</a>
    </form>
{% endblock %}
