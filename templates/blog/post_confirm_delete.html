{% extends 'blog/base.html' %}

{% block title %}Удаление поста — Blog System{% endblock %}

{% block content %}
    <h2>Удалить пост?</h2>
    <p>Вы уверены, что хотите удалить пост «{{ post.title }}»?</p>
    <p>{{ post.content|slice:":100" }}...</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'post_detail' post_id=post.id %}">Отмена</a>
    </form>
{% endblock %}
